<!DOCTYPE html>
<html style="background-color: #09090b;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleBridge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
      color: #f4f4f5;
    }

    /* Subtle radial glow behind the card, like the app's hero accent */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse at center,
        rgba(20, 184, 166, 0.06) 0%,
        transparent 70%);
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
    }

    /* Card container — matches app's zinc-900 card style */
    .card {
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px 48px;
      width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 24px 64px rgba(0,0,0,0.5),
        0 8px 24px rgba(0,0,0,0.3);
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Top bar (mimics the titlebar stripe) */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red    { background: #ef4444; opacity: 0.7; }
    .dot-yellow { background: #eab308; opacity: 0.7; }
    .dot-green  { background: #22c55e; opacity: 0.7; }
    .top-bar-title {
      margin-left: auto;
      margin-right: auto;
      font-size: 11px;
      font-weight: 600;
      color: #52525b;
      letter-spacing: 0.5px;
      transform: translateX(-18px); /* visually center with dots */
    }

    /* Logo */
    .logo-wrap {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #14b8a6, #059669);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow:
        0 0 0 1px rgba(20,184,166,0.2),
        0 0 32px rgba(20,184,166,0.25),
        0 8px 16px rgba(0,0,0,0.3);
      animation: logoPulse 3s ease-in-out infinite;
    }
    .logo-wrap svg {
      width: 36px;
      height: 36px;
    }

    /* App name */
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #f4f4f5;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #52525b;
      font-weight: 500;
      margin-bottom: 32px;
    }

    /* Version badge — same as the app's version chip */
    .version-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      color: #3f3f46;
      background: #27272a;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 36px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .version-badge span {
      color: #14b8a6;
    }

    /* Progress bar — matches the teal accent */
    .progress-track {
      width: 100%;
      height: 2px;
      background: #27272a;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #14b8a6, #059669, #14b8a6);
      background-size: 200% 100%;
      border-radius: 99px;
      animation: progressFlow 2s ease-in-out infinite;
    }

    /* Status text */
    .status {
      font-size: 12px;
      color: #52525b;
      font-weight: 500;
      transition: color 0.3s ease, opacity 0.3s ease;
      height: 18px;
    }
    .status.error { color: #ef4444; }

    /* Step indicators — same style as the app's small badges */
    .steps {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 28px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #3f3f46;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 6px;
      background: #27272a;
      border: 1px solid transparent;
      transition: all 0.4s ease;
    }
    .step.active {
      color: #14b8a6;
      background: rgba(20,184,166,0.08);
      border-color: rgba(20,184,166,0.2);
    }
    .step.done {
      color: #71717a;
    }
    .step-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ── Keyframes ── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(20,184,166,0.2), 0 0 32px rgba(20,184,166,0.25), 0 8px 16px rgba(0,0,0,0.3); }
      50%       { box-shadow: 0 0 0 1px rgba(20,184,166,0.35), 0 0 48px rgba(20,184,166,0.4), 0 8px 16px rgba(0,0,0,0.3); }
    }
    @keyframes progressFlow {
      0%   { background-position: 200% 0; width: 5%; }
      50%  { background-position: 0% 0;   width: 75%; }
      100% { background-position: -200% 0; width: 5%; }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="card">
    <!-- Titlebar stripe mimicking the app -->
    <div class="top-bar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <span class="top-bar-title">TeleBridge</span>
    </div>

    <!-- Logo -->
    <div class="logo-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        <path d="M8 10h8"/>
        <path d="M8 14h5"/>
      </svg>
    </div>

    <h1>TeleBridge</h1>
    <p class="subtitle">Telegram Bot Manager</p>

    <div class="version-badge">
      <span>v1.2</span> &nbsp;· Desktop
    </div>

    <!-- Progress -->
    <div class="progress-track" style="width:100%">
      <div class="progress-bar"></div>
    </div>

    <div class="status" id="status">Starting server...</div>

    <!-- Mini step indicators -->
    <div class="steps" id="steps">
      <div class="step active" id="step-server">
        <div class="step-dot"></div> Server
      </div>
      <div class="step" id="step-db">
        <div class="step-dot"></div> Database
      </div>
      <div class="step" id="step-app">
        <div class="step-dot"></div> App
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const stepServer = document.getElementById('step-server');
    const stepDb     = document.getElementById('step-db');
    const stepApp    = document.getElementById('step-app');

    const stages = [
      { msg: 'Starting server...', active: 'step-server' },
      { msg: 'Initializing database...', active: 'step-db' },
      { msg: 'Loading application...', active: 'step-app' },
      { msg: 'Almost ready...', active: 'step-app' },
    ];

    let idx = 0;
    function advanceStage() {
      idx = (idx + 1) % stages.length;
      const s = stages[idx];
      statusEl.textContent = s.msg;

      // Update step badges
      [stepServer, stepDb, stepApp].forEach(el => {
        el.classList.remove('active');
        if (el !== document.getElementById(s.active)) el.classList.add('done');
      });
      const activeEl = document.getElementById(s.active);
      activeEl.classList.remove('done');
      activeEl.classList.add('active');
    }

    const interval = setInterval(advanceStage, 2000);

    // Listen for status updates from Electron main process
    window.electronAPI?.onLoadStatus?.((msg) => {
      clearInterval(interval);
      statusEl.textContent = msg;
      if (msg.toLowerCase().includes('error') || msg.toLowerCase().includes('failed')) {
        statusEl.classList.add('error');
      }
    });
  </script>
</body>
</html>
